services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://host.docker.internal:6380
      PDF_S3_BUCKET: collab-editor-dev-455592559083
      PDF_STORAGE: local
      PDF_LOCAL_DIRECTORY: /var/lib/collab-editor/pdfs
      AWS_REGION: eu-north-1
      AWS_SDK_LOAD_CONFIG: "1"
      HOME: /root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${COLLAB_AWS_CONFIG_DIR:-/Users/farellengapgou/.aws}:/root/.aws:ro
      - pdf_runtime:/var/lib/collab-editor/pdfs
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_TARGET: http://api:3000
    depends_on:
      - api
volumes:
  pdf_runtime:
